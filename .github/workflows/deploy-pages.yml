name: Deploy static site to GitHub Pages

# Publish the static prototype from a fresh workflow run on every update to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check app.js\n      - name: Validate developer test runner\n        run: node --check dev.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      # Allow the Actions artifact service to make the uploaded Pages archive visible to the deployment API.
      - name: Wait for artifact availability
        run: sleep 15
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
